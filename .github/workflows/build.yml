name: Build SafariPlusUltimate

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: brew install ldid dpkg make

      - name: Install roothide Theos
        run: git clone --recursive --depth=1 https://github.com/roothide/theos.git "$HOME/theos"

      - name: Build
        run: |
          export THEOS="$HOME/theos"
          export PATH="$(brew --prefix make)/libexec/gnubin:$PATH"
          make clean package FINALPACKAGE=1

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: SafariPlusUltimate-deb
          path: packages/*.deb
